<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>기차표 예약</h1>
    <h2>출발역</h2>
    <div>
        <input type="radio"name="group_start" id="start-seoul"value="서울"/>서울</label>
        <input type="radio"name="group_start" id="start-kunan"value="천안"/>천안</label>
        <input type="radio"name="group_start" id="start-sajong"value="세종"/>세종</label>
        <input type="radio"name="group_start" id="start-iksan"value="익산"/>익산</label>

    </div>
    <h2>도착역</h2>
    <div>
        
      <select id="end">
        <option>여수</option>
        <option>목포</option>
        <option>광주</option>
        
      </select>
    </div>

      <button id="btn_se">제출</button>
        <p id="text-result"></p>
        <script>
        var btnSe=document.getElementById("btn_se")
        var textresult =document.getElementById("text-result")
     
        var end=document.getElementById("end")
        btnSe.addEventListener('click',()=>{
            var start=""
            var checkedStart = document.querySelector('input[name="group_start"]:checked');
         if(checkedStart){
            start=checkedStart.value}

            textresult.innerText="출발역:"+start+"  도착역:"+end.value
        })

        </script>

</body>
</html>
